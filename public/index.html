<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrikBag + Bagtunes</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="wrap">
    <div class="brand"><b>TrikBag</b><span>Bagtunes</span></div>
    <h1>Scan the bag.</h1>
    <div class="card intro">
      <p>Your corner store has a bag with Triks for kids to play and solve.</p>
      <p>You have music by local musicians to scan and listen.</p>
    </div>
    <div class="pair">
      <div class="card" style="padding:10px">
        <img class="hero-img" src="/art/TrikBag-sign.jpg" alt="TrikBag poster: puzzles and a guitar" />
      </div>
      <div class="card" style="padding:10px">
        <img class="hero-img" src="/art/TrikBag-sticker.jpg" alt="TrikBag sticker: scan, guitar, and puzzle" />
      </div>
    </div>
    <p class="lead">Pick the shop on the bag.</p>
    <div class="card list" id="stores">Loading shops…</div>
    <footer>Print one QR per store: /s/ROSE · /s/711-J · /s/OAK</footer>
  </div>
  <script src="/js/shared.js"></script>
  <script>
    Bag.get("/api/stores").then(({ stores }) => {
      const box = document.getElementById("stores");
      box.innerHTML = stores.map((s) => `
        <a class="store-link" href="/s/${s.id}">
          <div class="store">${s.name}</div>
          <div class="muted">${s.neighborhood} · treat: ${s.treat}</div>
        </a>`).join("");
    });
  </script>
</body>
</html>
